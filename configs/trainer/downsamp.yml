# configs/trainer/downsamp.yml
epochs: 100
batch_size: 16
lr: 5e-4
weight_decay: 0.01          # now respected by train.py
early_stop_patience: 20
early_stop_min_delta: 0.001
device: cuda
lambda_smooth: 0.01         # was 0.1 — collapse fix
time_alignment: downsample_labels
early_stop_monitor: val_f1