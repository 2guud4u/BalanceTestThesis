# configs/trainer/downsamp.yml
epochs: 1000
batch_size: 16
lr: 5e-4
weight_decay: 0.0001        # plain Adam; 0.01 caused weight collapse
early_stop_patience: 20
early_stop_min_delta: 0.001
device: cuda
lambda_smooth: 0.01         # was 0.1 — collapse fix
time_alignment: upsample_labels
early_stop_monitor: val_f1