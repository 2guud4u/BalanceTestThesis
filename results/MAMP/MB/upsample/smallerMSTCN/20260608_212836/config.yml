encoder:
  config_path: /code/jjiang23/pathml/aim2_balanceV2/models/encoders/MY_MAMP/pretrain_mamp_t120_layer8+5_mask90.yaml
  checkpoint_path: /data2/pathml/MAMP/checkpoints/checkpoints/ntu120_xset.pth
  init_encoder_path: /code/jjiang23/BalanceTestThesis/initializers/encoder/MAMP.py
data:
  window_size: 120
  stride: 60
  h5_key: motionBert_cropped_iou
  augment: true
  normalize: false
  split_ratio: 0.8
  graph_args:
    layout: mb
    strategy: spatial
  num_joints: 17
trainer:
  epochs: 1000
  batch_size: 16
  lr: 5e-4
  weight_decay: 0.0001
  early_stop_patience: 20
  early_stop_min_delta: 0.001
  device: cuda
  lambda_smooth: 0.01
  time_alignment: upsample_preds
  early_stop_monitor: val_f1
segmentor:
  num_layers_PG: 6
  num_layers_R: 6
  num_R: 2
  num_f_maps: 64
  num_classes: 2
  init_segmentor_path: /code/jjiang23/BalanceTestThesis/initializers/segementor/MSTCN.py
paths:
  encoder_cfg_path: /code/jjiang23/BalanceTestThesis/configs/encoder/MAMP.yml
  data_cfg_path: /code/jjiang23/pathml/aim2_balanceV2/configs/data/MB.yml
  trainer_cfg_path: /code/jjiang23/BalanceTestThesis/configs/trainer/upsample.yml
  segmentor_cfg_path: /code/jjiang23/BalanceTestThesis/configs/segmentor/smallerMSTCN.yml
  splits_path: /code/jjiang23/pathml/aim2_balanceV2/data/splits.json
