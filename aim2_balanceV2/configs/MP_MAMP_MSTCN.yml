trainer_config:
  epochs: 100
  batch_size: 16
  lr: 5e-4  
  weight_decay: 0.00
  early_stop_patience: 20
  early_stop_min_delta: 0.001
  device: cuda
  lambda_smooth: 0.1
  time_alignment: upsample_preds
