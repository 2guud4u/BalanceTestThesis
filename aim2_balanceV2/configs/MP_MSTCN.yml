dataloader_config:
  window_size: 256
  stride: 128
  h5_key: camera_mp_cropped_iou
  augment: True
  normalize: False
  split_ratio: 0.8

encoder_config: None

segmentor_config:
  num_layers_PG: 10
  num_layers_R: 10
  num_R: 4
  num_f_maps: 64

save_dir: /code/jjiang23/pathml/aim2_balanceV2/results/CAMMP_MSGCN_MSTCN/

trainer_config:
  epochs: 100
  batch_size: 16
  lr: 1e-4  
  weight_decay: 0.01
  early_stop_patience: 15
  early_stop_min_delta: 0.001
  device: cuda
  lambda_smooth: 0.15
  # val_f1 or val_loss 
  early_stop_monitor: val_f1
